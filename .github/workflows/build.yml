
name: Build VELORA Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build VELORA-Setup.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python source
        run: python -m py_compile velora.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone VELORA application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name VELORA velora.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "installer\VELORA.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "installer\Output\VELORA-Setup.exe")) {
            throw "VELORA-Setup.exe was not created"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VELORA-Setup-Windows
          path: installer/Output/VELORA-Setup.exe
          if-no-files-found: error
