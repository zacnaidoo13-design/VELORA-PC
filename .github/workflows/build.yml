
name: Build VELORA for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pyinstaller

      - run: pyinstaller --noconfirm --clean --onefile --windowed --name VELORA velora.py

      - uses: actions/upload-artifact@v4
        with:
          name: VELORA-Windows
          path: dist/VELORA.exe
